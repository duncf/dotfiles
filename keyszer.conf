keymap(
    "VSCodes",
    {
        # duncf
        # From terminal section below. Might make sense to limit to vscode.
        K("RC-Z"): K("C-Shift-Z"),
        K("RC-Y"): K("C-Shift-Y"),
        K("RC-V"): K("C-Shift-V"),
        K("RC-X"): K("C-Shift-X"),
        K("RC-C"): K("C-Shift-C"),

        # In VSCode, we want different keybindings for Find in Files and Find in
        # Workspace. Cmd-F is Find in Files, Cmd-Shift-F is Find in Workspace,
        # map these to C-Shift-F and C-Alt-Shift-F respectively, and we'll
        # rebind in vscode.
        K("RC-F"): K("C-Shift-F"),
        K("RC-Shift-F"): K("C-Alt-Shift-F"),

        # duncf - Ctrl-K is built-in for many vscode keybindings, but it
        # interferes with Ctrl-K in shell. Make LC-K do Ctrl-Shift-K, and map
        # that to kill line in VScode. RC-K will do Ctrl-k and invoke command
        # pallete as intended.
        K("LC-K"): K("C-Shift-K"),
    },
    when=wm_class_match(f"(?i){codeStr}"),
)

keymap(
    "Wordwise (not vscode)",
    {
        # Wordwise remaining - for Everything but VS Code
        K("Alt-Left"): K("C-Left"),  # Left of Word
        K("Alt-Shift-Left"): K("C-Shift-Left"),  # Select Left of Word
        K("Alt-Right"): K("C-Right"),  # Right of Word
        K("Alt-Shift-Right"): K("C-Shift-Right"),  # Select Right of Word
        K("Alt-Shift-g"): K("C-Shift-g"),  # View source control
        # ** VS Code fix **
        #   Electron issue precludes normal keybinding fix.
        #   Alt menu auto-focus/toggle gets in the way.
        #
        #   refer to ./xkeysnail-config/vscode_keybindings.json
        # **
        #
        # ** Firefox fix **
        #   User will need to set "ui.key.menuAccessKeyFocuses"
        #   under about:config to false.
        #
        #   https://superuser.com/questions/770301/pentadactyl-how-to-disable-menu-bar-toggle-by-alt
        # **
        #
    },
    when=lambda ctx: ctx.wm_class.casefold() not in vscodes,
)

